# AirHost — full local stack.
#
# NOTE on Keycloak hostnames: tokens are issued with an `iss` claim that must be
# resolvable identically by the browser and by the backend. We pin Keycloak's
# hostname to `keycloak`, reachable inside the Docker network by service name.
# For browser logins to work, add this line to your hosts file:
#     127.0.0.1   keycloak
# (Windows: C:\Windows\System32\drivers\etc\hosts)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airhost
      POSTGRES_PASSWORD: airhost
      POSTGRES_DB: airhost
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # The image has bash (/dev/tcp) but no curl/wget. Use a well-formed HTTP/1.1
      # request WITH a Host header (a Host-less request makes Keycloak 500) against
      # the realm's OIDC discovery doc, and confirm it is fully loaded by matching
      # "issuer" in the response.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/airhost/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'issuer' <&3"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # Configure the `local` alias first (the server image does not preconfigure
      # one), then probe readiness, so the check works regardless of mc defaults.
      test:
        - CMD-SHELL
        - "mc alias set local http://127.0.0.1:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready local"
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI — inspect captured emails at http://localhost:8025

  api:
    build:
      context: ./backend
    # Self-heal if a dependency is briefly unavailable at startup (e.g. Keycloak
    # still warming up) instead of exiting permanently.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_PORT: "8081"
      HTTP_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
      # Proxy IPs/CIDRs whose X-Forwarded-For is trusted for the client IP (rate
      # limiting). Empty = trust none (use the direct peer); set to your LB range
      # behind a reverse proxy.
      HTTP_TRUSTED_PROXIES: "${HTTP_TRUSTED_PROXIES:-}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: airhost
      DB_PASSWORD: airhost
      DB_NAME: airhost
      DB_SSLMODE: disable
      DB_MIGRATIONS_PATH: /app/internal/infrastructure/persistence/postgres/migrations
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/airhost
      KEYCLOAK_CLIENT_ID: airhost-api
      SERVICE_FEE_RATE: "0.12"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: airhost-media
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_HOST: http://localhost:9000
      EMAIL_FROM: no-reply@airhost.dev
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      # Payment gateway: "fake" (default), "stripe", "appypay", "gpayangola" or
      # "auto" (route by currency: domestic AOA → GPay Angola with AppyPay
      # failover; foreign → Stripe). Supply the matching secret via the
      # environment (never commit real keys); a missing secret falls back to the
      # fake gateway.
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-fake}"
      PAYMENT_DOMESTIC_CURRENCY: "${PAYMENT_DOMESTIC_CURRENCY:-AOA}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      # Stripe Connect connected-account (acct_…) used as the destination for host
      # payout transfers. When set with provider=stripe, payouts hit the real
      # Stripe transfers API; otherwise payouts use the fake rail.
      STRIPE_CONNECT_ACCOUNT: "${STRIPE_CONNECT_ACCOUNT:-}"
      APPYPAY_TOKEN: "${APPYPAY_TOKEN:-}"
      GPAYANGOLA_API_KEY: "${GPAYANGOLA_API_KEY:-}"
      # Webhook signing secrets. A provider's webhook route is only enabled when
      # its secret is set (POST /api/v1/webhooks/payments/<provider>).
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      APPYPAY_WEBHOOK_SECRET: "${APPYPAY_WEBHOOK_SECRET:-}"
      GPAYANGOLA_WEBHOOK_SECRET: "${GPAYANGOLA_WEBHOOK_SECRET:-}"
      # Per-IP token bucket guarding the webhook route.
      WEBHOOK_RATE_RPS: "${WEBHOOK_RATE_RPS:-5}"
      WEBHOOK_RATE_BURST: "${WEBHOOK_RATE_BURST:-20}"
      # Scheduled retention for the webhook dedupe table.
      WEBHOOK_RETENTION_DAYS: "${WEBHOOK_RETENTION_DAYS:-30}"
      WEBHOOK_CLEANUP_INTERVAL: "${WEBHOOK_CLEANUP_INTERVAL:-24h}"
      # Alertmanager base URL: enables the admin silence endpoints
      # (/api/v1/admin/alerts/silences). Leave empty to disable.
      ALERTMANAGER_URL: "${ALERTMANAGER_URL:-http://alertmanager:9093}"
      # Shared token required on POST /webhooks/alerts (Alertmanager → API). When
      # empty the route is open (trusted by the internal network).
      ALERT_WEBHOOK_TOKEN: "${ALERT_WEBHOOK_TOKEN:-}"
      # Request hardening: cap non-multipart bodies and per-IP API rate limit.
      MAX_REQUEST_BODY_BYTES: "${MAX_REQUEST_BODY_BYTES:-1048576}"
      API_RATE_RPS: "${API_RATE_RPS:-30}"
      API_RATE_BURST: "${API_RATE_BURST:-60}"
    ports:
      - "8081:8081"

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - api
      - alertmanager
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:latest
    environment:
      # Set this to forward critical alerts to Slack; leave empty to email only.
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      # Bearer token sent to the API's /webhooks/alerts receiver. Must match the
      # api service's ALERT_WEBHOOK_TOKEN when that is set; harmless otherwise.
      ALERT_WEBHOOK_TOKEN: "${ALERT_WEBHOOK_TOKEN:-}"
    # Alertmanager does not expand env vars in its config file, so write the Slack
    # webhook URL and the API webhook token to the paths the config reads
    # (api_url_file / credentials_file), then exec. The token file is kept
    # non-empty so the credentials_file always loads.
    entrypoint:
      - /bin/sh
      - -c
      - 'echo "${SLACK_WEBHOOK_URL:-https://hooks.slack.invalid/disabled}" > /tmp/slack_url && echo "${ALERT_WEBHOOK_TOKEN:-airhost-local-alerts}" > /tmp/alert_token && exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager'
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  postgres-data:
  minio-data:
  grafana-data:
