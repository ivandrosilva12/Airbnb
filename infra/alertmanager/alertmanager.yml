# Alertmanager routing for AirHost.
#
# All alerts are emailed (locally via MailHog; point `smarthost` at a real relay
# in production). Critical alerts are additionally sent to Slack when a webhook
# URL is provided — the docker-compose entrypoint writes $SLACK_WEBHOOK_URL to
# /tmp/slack_url, which the Slack receiver reads via `api_url_file`.
#
# Resolved notifications are routed to a separate destination (the resolved
# mailbox / #airhost-resolved Slack channel) by templating the destination
# fields on `.Status` — Alertmanager sends a "resolved" notification only once
# every alert in the group has cleared, so .Status reliably distinguishes them.
#
# Each alert carries a `runbook_url` annotation (see infra/prometheus/alerts.yml).
# The Slack `text` renders it as a clickable link; the default e-mail template
# lists all annotations (including runbook_url) automatically, so on-call can jump
# straight from the notification to docs/runbooks/<Alert>.md.
global:
  resolve_timeout: 5m

route:
  receiver: team-email
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical
      continue: true

receivers:
  - name: team-email
    email_configs:
      - to: '{{ if eq .Status "resolved" }}resolved@airhost.dev{{ else }}oncall@airhost.dev{{ end }}'
        from: 'alertmanager@airhost.dev'
        smarthost: 'mailhog:1025'
        require_tls: false
        send_resolved: true

  - name: critical
    email_configs:
      - to: '{{ if eq .Status "resolved" }}resolved@airhost.dev{{ else }}oncall@airhost.dev{{ end }}'
        from: 'alertmanager@airhost.dev'
        smarthost: 'mailhog:1025'
        require_tls: false
        send_resolved: true
    slack_configs:
      - api_url_file: /tmp/slack_url
        channel: '{{ if eq .Status "resolved" }}#airhost-resolved{{ else }}#airhost-alerts{{ end }}'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ if .Annotations.runbook_url }}Runbook: <{{ .Annotations.runbook_url }}|{{ .Labels.alertname }}>\n{{ end }}{{ end }}"

inhibit_rules:
  # While the API is down, mute the noisier warnings it would trigger.
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ['alertname']
