name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Download modules
        run: go mod download
      - name: Verify formatting
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "These files are not gofmt-formatted:"; echo "$fmt_out"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...

  integration:
    name: Integration (real Keycloak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Start Keycloak with the airhost realm
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -v "${{ github.workspace }}/infra/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:25.0 start-dev --import-realm
      - name: Wait for the realm to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/realms/airhost/.well-known/openid-configuration >/dev/null; then
              echo "Keycloak ready"; exit 0
            fi
            sleep 3
          done
          echo "Keycloak did not become ready"; docker logs keycloak; exit 1
      - name: Run integration tests
        working-directory: backend
        env:
          KEYCLOAK_ISSUER: http://localhost:8080/realms/airhost
        run: go test -tags=integration ./internal/interfaces/http/ -run Integration -v

  postgres-integration:
    name: Postgres integration (UoW rollback + split atomicity)
    runs-on: ubuntu-latest
    # Exercises the S41 tests in internal/infrastructure/persistence/postgres
    # — they skip when POSTGRES_TEST_DSN is unset (the dev-machine default),
    # so without this job nothing would actually run them in CI. The DSN
    # below matches the service container booted right next to the job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: airhost
          POSTGRES_PASSWORD: airhost
          POSTGRES_DB: airhost
        ports:
          - 5432:5432
        # Healthcheck guarantees the container is ready before the test step;
        # otherwise the first pgxpool.Ping in withTestDB races the boot.
        options: >-
          --health-cmd "pg_isready -U airhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Run postgres integration tests
        working-directory: backend
        env:
          # Migrations + truncate run on this DSN in withTestDB. Same shape
          # as the docker-compose dev stack so devs can copy-paste the
          # command from the test file header.
          POSTGRES_TEST_DSN: postgres://airhost:airhost@localhost:5432/airhost?sslmode=disable
        run: go test ./internal/infrastructure/persistence/postgres/... -run Integration -v

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # No emulator/test suite in CI; validate that dependencies resolve and the
      # Expo project config is well-formed (the strongest non-flaky check here).
      - name: Install
        run: npm ci
      - name: Expo config check
        run: npx --yes expo config --type public >/dev/null

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan backend
        working-directory: backend
        run: govulncheck ./...

  web-audit:
    name: Web npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: web
        run: npm ci && npm audit --audit-level=high

  mobile-audit:
    name: Mobile npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: mobile
        run: npm ci && npm audit --audit-level=high

  trivy:
    name: Filesystem vuln scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
