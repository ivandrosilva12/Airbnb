name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Download modules
        run: go mod download
      - name: Verify formatting
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "These files are not gofmt-formatted:"; echo "$fmt_out"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...

  integration:
    name: Integration (real Keycloak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Start Keycloak with the airhost realm
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -v "${{ github.workspace }}/infra/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:25.0 start-dev --import-realm
      - name: Wait for the realm to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/realms/airhost/.well-known/openid-configuration >/dev/null; then
              echo "Keycloak ready"; exit 0
            fi
            sleep 3
          done
          echo "Keycloak did not become ready"; docker logs keycloak; exit 1
      - name: Run integration tests
        working-directory: backend
        env:
          KEYCLOAK_ISSUER: http://localhost:8080/realms/airhost
        run: go test -tags=integration ./internal/interfaces/http/ -run Integration -v

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
