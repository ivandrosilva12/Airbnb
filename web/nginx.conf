server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (S50) ----------------------------------------------
    #
    # These apply to every response — static asset OR the SPA shell. Some are
    # only meaningful on the index.html document (CSP, X-Frame-Options), but
    # setting them globally is harmless on fingerprinted assets and keeps the
    # config simple. "always" makes nginx emit them on 4xx/5xx too, so a 404
    # for a missing asset is not a CSP-blind response a hostile script could
    # exploit.
    #
    # Content-Security-Policy
    #   default-src 'self'         — only same-origin by default
    #   script-src  'self'         — Vite emits hashed module scripts; no inline
    #   style-src   'self' 'unsafe-inline'
    #                              — react-router/MUI inject runtime styles via
    #                                style attributes; loosening to inline is
    #                                pragmatic. Hashed external stylesheets
    #                                only otherwise.
    #   img-src     'self' data: https://storage.test http://localhost:9000
    #                              — listing photos served from MinIO. Keep
    #                                "http://localhost:9000" for dev; tighten
    #                                in production via the nginx ENV substitution
    #                                hook in a follow-up slice.
    #   connect-src 'self' http://localhost:8081 ws://localhost:8081
    #                              — backend API + SSE realtime stream. Add the
    #                                production API origin via env-templated
    #                                nginx config in deployment.
    #   font-src    'self' data:   — fonts loaded from the bundle.
    #   object-src  'none'         — kills <object>/<embed> injection.
    #   base-uri    'self'         — locks the document base.
    #   form-action 'self'         — forms only submit same-origin.
    #   frame-ancestors 'none'     — superset of X-Frame-Options; the API
    #                                /openapi.* renderer would clear this if
    #                                we ever serve Swagger-UI from this host.
    #
    # In production this string is overridden by templating a stricter CSP that
    # drops 'unsafe-inline' once the MUI runtime-style usage is audited.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http://localhost:9000; connect-src 'self' http://localhost:8081 ws://localhost:8081; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Defence-in-depth even though frame-ancestors above already covers it.
    add_header X-Frame-Options "DENY" always;
    # Block MIME-sniffing — a hostile upload masquerading as text/plain cannot
    # be re-interpreted as a script.
    add_header X-Content-Type-Options "nosniff" always;
    # No referrer leakage to third parties.
    add_header Referrer-Policy "no-referrer" always;
    # Deny every powerful capability the SPA does not need. Adding a capability
    # later is opt-in (e.g. payment=(self) when we wire WebAuthn).
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), web-share=()" always;
    # HSTS — harmless over plain HTTP in dev, effective once served via TLS.
    # 1-year max-age + subdomains; preload is intentionally NOT included until
    # the operator decides to register the host on the HSTS preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Cross-Origin isolation primitives: keep the SPA in its own browsing
    # context group so a cross-origin opener can't reach this window.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # Compress text assets on the wire (JS/CSS/HTML/JSON/SVG).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Long-cache the fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: fall back to index.html so client-side routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
