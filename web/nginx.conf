server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: fall back to index.html so client-side routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
